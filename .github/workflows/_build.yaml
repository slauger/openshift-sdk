name: Build

# Shared by build.yml (push to master, daily schedule) and release.yaml
# (manual release), so that a release attaches the SBOMs of the images it
# built in the same run.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  discover-versions:
    name: Discover OpenShift versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.channels.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Discover latest stable channels
        id: channels
        run: |
          matrix=$(python3 scripts/discover_versions.py)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build-image:
    name: Build & Push (${{ matrix.release_channel }})
    needs: discover-versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Keyless cosign signing exchanges this OIDC token for a Fulcio
      # certificate, so no private key has to be managed.
      id-token: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-versions.outputs.matrix) }}

    env:
      DEPLOYMENT_TYPE: ocp
      RELEASE_CHANNEL: ${{ matrix.release_channel }}
      OPENSHIFT_RELEASE: ${{ matrix.openshift_release }}
      REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Install tools (make, jq, curl, wget)
        run: |
          sudo apt-get update
          sudo apt-get install -y make jq curl wget

      - name: Fetch
        run: make fetch

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Push
        run: make push

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Install crane
        uses: imjasonh/setup-crane@v0.7

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.24.3

      # docker push records the manifest digest in RepoDigests. The image is
      # single-arch and pushed as a plain manifest, so the linux/amd64 digest
      # is the same one; crane only makes a difference if the push ever turns
      # into an index (containerd image store, BuildKit attestations).
      - name: Resolve image digest
        id: digest
        run: |
          IMAGE_REF=$(make -s print_image)
          IMAGE="${IMAGE_REF%:*}"
          PUSHED=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE_REF}" \
            | grep -m1 "^${IMAGE}@" | cut -d@ -f2 || true)
          if [ -z "${PUSHED}" ]; then
            echo "::error::could not determine the pushed digest of ${IMAGE_REF}"
            exit 1
          fi
          DIGEST=$(crane digest --platform linux/amd64 "${IMAGE}@${PUSHED}")
          if [ -z "${DIGEST}" ]; then
            echo "::error::no linux/amd64 image in ${IMAGE}@${PUSHED}"
            exit 1
          fi
          {
            echo "image=${IMAGE}"
            echo "pushed=${PUSHED}"
            echo "digest=${DIGEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Sign image with cosign (keyless)
        run: cosign sign --yes "${{ steps.digest.outputs.image }}@${{ steps.digest.outputs.pushed }}"

      - name: Generate SBOMs
        env:
          # Packages only: without this, every file owned by an RPM becomes a CycloneDX component
          SYFT_FILE_METADATA_SELECTION: none
          IMAGE: ${{ steps.digest.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          mkdir -p sbom
          BASE="sbom/openshift-sdk-${OPENSHIFT_RELEASE}-linux-amd64"
          syft scan "registry:${IMAGE}@${DIGEST}" \
            --source-name "${IMAGE}" --source-version "${OPENSHIFT_RELEASE}" \
            -o "cyclonedx-json=${BASE}.cdx.json" \
            -o "spdx-json=${BASE}.spdx.json"

      # An SBOM describes one platform image, so it is attested against the
      # platform digest. cosign verify-attestation has no --platform flag.
      - name: Attest CycloneDX SBOM with cosign (keyless)
        run: |
          cosign attest --yes --type cyclonedx \
            --predicate "sbom/openshift-sdk-${OPENSHIFT_RELEASE}-linux-amd64.cdx.json" \
            "${{ steps.digest.outputs.image }}@${{ steps.digest.outputs.digest }}"

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom-openshift-sdk-${{ matrix.openshift_release }}
          path: sbom/*.json
          retention-days: 7
