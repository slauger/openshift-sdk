name: Build (Docker) with matrix

on:
  push:
    branches:
      - master
  schedule:
    # Runs daily at 01:00 UTC (~ 03:00 Europe/Berlin during DST)
    - cron: '0 1 * * *'

# Serializes concurrent runs similar to GitLab's resource_group. release.yaml
# uses the same group, so a release build never races a scheduled one.
concurrency:
  group: build-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build.yaml
    secrets: inherit
