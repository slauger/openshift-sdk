---
schemaVersion: "2.0.0"

commandTests:
  - name: "openshift clients works"
    command: "oc"
    args: ["version"]
  - name: "openshift-install client works"
    command: "openshift-install"
    args: ["version"]
  - name: "kubectl works"
    command: "kubectl"
    args: ["version", "--client"]
  - name: "make exists"
    command: "which"
    args: ["make"]
  - name: "helm exists"
    command: "helm"
    args: ["version"]
  - name: "ansible exists"
    command: "ansible"
    args: ["--version"]
  - name: "helmfile exists"
    command: "helmfile"
    args: ["version"]
  - name: "vault exists"
    command: "vault"
    args: ["version"]
  - name: "govc exists"
    command: "govc"
    args: ["version"]
  - name: "yq exists"
    command: "yq"
    args: ["--version"]
  - name: "stern exists"
    command: "stern"
    args: ["--version"]
  - name: "kubectx exists"
    command: "kubectx"
    args: ["--version"]
  - name: "kubens exists"
    command: "kubens"
    args: ["--version"]
  - name: "tkn exists"
    command: "tkn"
    args: ["version"]
  - name: "kn exists"
    command: "kn"
    args: ["version"]
  - name: "argocd exists"
    command: "argocd"
    args: ["version", "--client"]
  - name: "virtctl exists"
    command: "virtctl"
    args: ["version", "--client"]
  - name: "kubectl-mtv exists"
    command: "kubectl-mtv"
    args: ["version"]
  - name: "velero exists"
    command: "velero"
    args: ["version", "--client-only"]
  - name: "kubectl-oadp exists"
    command: "kubectl-oadp"
    args: ["version", "--client-only"]
  - name: "roxctl exists"
    command: "roxctl"
    args: ["version"]
  - name: "hcp exists"
    command: "hcp"
    args: ["version", "--client-only"]
  - name: "oc-mirror exists"
    command: "oc-mirror"
    args: ["--v2", "--version"]
  - name: "oc bash completion is registered"
    command: "bash"
    args: ["-c", "source /etc/bash_completion.d/oc && complete -p oc"]
  - name: "kubectl bash completion is registered"
    command: "bash"
    args: ["-c", "source /etc/bash_completion.d/kubectl && complete -p kubectl"]
  - name: "virtctl bash completion is registered"
    command: "bash"
    args: ["-c", "source /etc/bash_completion.d/virtctl && complete -p virtctl"]
  - name: "vault bash completion is registered"
    command: "bash"
    args: ["-c", "source /etc/bash_completion.d/vault && complete -p vault"]
  - name: "kubectx bash completion is registered"
    command: "bash"
    args: ["-c", "source /etc/bash_completion.d/kubectx && complete -p kubectx"]
  - name: "every completion loads in an interactive shell"
    command: "bash"
    args: ["-ic", "for t in oc kubectl openshift-install helm helmfile tkn kn argocd velero virtctl roxctl hcp kubectl-mtv oc-mirror stern yq vault kubectx kubens; do complete -p $t > /dev/null || { echo missing completion: $t; exit 1; }; done"]
